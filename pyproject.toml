[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewmindbot"
version = "0.1.0"
description = "Intelligent pull request code review tool powered by LLM providers that automatically analyzes diffs and provides actionable feedback"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Ankit Rai", email = "raia85859@gmail.com"}
]
keywords = ["code-review", "ai", "llm", "github", "diff-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "langchain-core>=1.2.0",
    "langchain-text-splitters>=1.1.0",
    "google-genai>=1.0.0",
    "openai>=2.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black>=22.0", "ruff>=0.1.0"]

[project.urls]
Homepage = "https://github.com/2001-Ankit/pr-review-mind-bot"
Repository = "https://github.com/2001-Ankit/pr-review-mind-bot"
Issues = "https://github.com/2001-Ankit/pr-review-mind-bot/issues"

[project.scripts]
reviewmindbot = "app.cli:main"