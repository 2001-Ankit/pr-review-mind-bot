[project]
name = "reviewmindbot"
version = "0.1.0"
description = "Intelligent pull request code review tool powered by LLM providers that automatically analyzes diffs and provides actionable feedback"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "langchain-core>=1.2.0",
    "langchain-text-splitters>=1.1.0",
    "google-genai>=1.0.0",
    "openai>=2.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
reviewmindbot = "app.cli:main"
